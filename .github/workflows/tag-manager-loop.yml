name: Tag Manager loop

# One agent-loop-kit round per job for TCzaba/czaba-tag-manager. Independent of the Studio loop:
# its own folder (tag-manager/), switch (tag-manager/cloud/ENABLED), kick file and concurrency group.
on:
  schedule:
    - cron: "15,45 * * * *"
  workflow_dispatch: {}
  push:
    paths: ["tag-manager/cloud/KICK"]

concurrency:
  group: tag-manager-loop
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  round:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    env:
      CZ_ROOT: /home/runner/czaba-project
      KIT_DIR: /home/runner/agent-loop-kit
      LOOP_TIMEOUT_MIN: "320"
      GH_TOKEN: ${{ github.token }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      LOOP_PATCH_KEY: ${{ secrets.LOOP_PATCH_KEY }}
    steps:
      - name: Check secrets
        run: |
          [ -n "${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}" ] || { echo "::error::Add the CLAUDE_CODE_OAUTH_TOKEN secret (claude setup-token)"; exit 1; }
          [ -n "${{ secrets.STORE_PUSH_TOKEN }}" ] || { echo "::error::Add the STORE_PUSH_TOKEN secret (classic PAT with repo + workflow)"; exit 1; }

      - name: Checkout loop state
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: main
          token: ${{ secrets.STORE_PUSH_TOKEN }}

      - name: Is the Tag Manager loop switched on?
        id: enabled
        run: |
          if [ -f tag-manager/cloud/ENABLED ] && [ -f tag-manager/loop/status.json ]; then echo "on=true" >> "$GITHUB_OUTPUT"; else echo "Tag Manager loop is off (no tag-manager/cloud/ENABLED)."; echo "on=false" >> "$GITHUB_OUTPUT"; fi

      - name: Git identity and credentials
        if: steps.enabled.outputs.on == 'true'
        run: |
          git config --global user.name "Saba Shavidze"
          git config --global user.email "sabashavidze@gmail.com"
          git config --global url."https://x-access-token:${{ secrets.STORE_PUSH_TOKEN }}@github.com/".insteadOf "https://github.com/"

      - name: Get Tag Manager and kit
        if: steps.enabled.outputs.on == 'true'
        run: |
          mkdir -p "$CZ_ROOT"
          git clone -q https://github.com/TCzaba/czaba-tag-manager.git "$CZ_ROOT/czaba-tag-manager"
          git clone -q --depth 1 https://github.com/shavidze/agent-loop-kit.git "$KIT_DIR"
          git -C "$CZ_ROOT/czaba-tag-manager" log --oneline -1
          git -C "$KIT_DIR" log --oneline -1

      - uses: actions/setup-node@v4
        if: steps.enabled.outputs.on == 'true'
        with:
          node-version: 22

      - name: Install Tag Manager, Electron dependencies and Claude Code
        if: steps.enabled.outputs.on == 'true'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb ffmpeg
          cd "$CZ_ROOT/czaba-tag-manager" && npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
          npm install -g @anthropic-ai/claude-code
          claude --version
          pwsh --version

      - name: Claude Code settings (Opus 5.5 1M + Fable advisor; agents may edit .claude/** except settings and hooks)
        if: steps.enabled.outputs.on == 'true'
        run: |
          mkdir -p ~/.claude
          HOOK="$GITHUB_WORKSPACE/tag-manager/cloud/allow-claude-dir.py"
          jq -n --arg cmd "python3 $HOOK" '{model: "claude-opus-5-5[1m]", advisorModel: "fable", hooks: {PermissionRequest: [{matcher: "Edit|Write|MultiEdit", hooks: [{type: "command", command: $cmd}]}]}}' > ~/.claude/settings.json
          cat ~/.claude/settings.json

      - name: Run one loop round
        if: steps.enabled.outputs.on == 'true'
        env:
          HUSKY: "0"
        run: bash tag-manager/cloud/run.sh

      - name: Tell Saba when the job itself fails
        if: failure()
        run: |
          if [ -z "$(gh issue list -R "$GITHUB_REPOSITORY" --state open --label tm-loop-attention --json number --jq '.[0].number')" ]; then
            gh label create tm-loop-attention -R "$GITHUB_REPOSITORY" --color D93F0B --description "The Tag Manager loop needs Saba" >/dev/null 2>&1 || true
            gh issue create -R "$GITHUB_REPOSITORY" --label tm-loop-attention --title "Tag Manager loop: job failed before or during the round" --body "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID. The scheduled job retries every 30 minutes; if it keeps failing, the setup step needs a fix."
          fi

      - name: Upload loop logs
        if: always() && steps.enabled.outputs.on == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: tm-loop-logs-${{ github.run_id }}
          path: |
            tag-manager/loop/loop.log
            tag-manager/loop/status.json
            tag-manager/loop/gates/
          retention-days: 14
          if-no-files-found: ignore
