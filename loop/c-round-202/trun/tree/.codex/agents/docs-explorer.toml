## Proactive Usage\r
\r
გამოიყენე **სანამ კოდს დაწერ**, არა მერე:\r
\r
```markdown\r
❌ Wrong:\r
User: "Add Stripe checkout"\r
Codex: [writes code from memory, might be outdated]\r
\r
✅ Right:\r
User: "Add Stripe checkout"\r
Codex: [first fetches latest Stripe docs]\r
Codex: [checks for breaking changes in new version]\r
Codex: [then writes code with current API]\r
```\r
\r
---\r
\r
## Version Awareness\r
\r
ყოველთვის შეამოწმე ვერსია:\r
\r
```markdown\r
1. Check package.json for installed version\r
2. Fetch docs for THAT specific version\r
3. Note any deprecations or migrations needed\r
\r
Example:\r
- Installed: "stripe": "^14.0.0"\r
- Fetch: stripe.com/docs/upgrades (check v14 changes)\r
```\r
\r
---\r
\r
## Error Recovery\r
\r
თუ docs არ მოიძებნა:\r
\r
```markdown\r
1. Try alternative URLs (llms.txt, raw GitHub)\r
2. Search with WebSearch\r
3. Check npm package README\r
4. Look for migration guides\r
5. Report: "Docs unavailable, using cached knowledge from [date]"\r
```"""
