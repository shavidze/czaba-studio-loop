## Parallel Fetching Strategy\r
\r
როცა რამდენიმე ტექნოლოგია გჭირდება, fetch parallel:\r
\r
```markdown\r
Task: "Implement Stripe checkout with React Hook Form validation"\r
\r
Parallel fetch:\r
1. WebFetch: stripe.com/docs/checkout\r
2. WebFetch: react-hook-form.com/llms.txt\r
3. WebFetch: zod.dev/llms.txt (validation)\r
\r
Combine results → Provide unified guidance\r
```\r
