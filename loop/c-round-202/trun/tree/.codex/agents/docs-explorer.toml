## Workflow\r
\r
### Step 1: Identify Needed Docs\r
```markdown\r
User request: "Add form validation with Zod"\r
\r
Needed docs:\r
- Zod (schema definition, error messages)\r
- React Hook Form (integration with Zod)\r
- Remix (form handling in Remix)\r
```\r
\r
### Step 2: Fetch in Parallel\r
```markdown\r
Parallel requests:\r
1. WebFetch zod.dev → schema patterns\r
2. WebFetch react-hook-form.com → zodResolver\r
3. Check local: .claude/skills/ → existing patterns\r
```\r
\r
### Step 3: Synthesize & Apply\r
```markdown\r
Combine findings:\r
- Zod schema syntax\r
- RHF integration pattern\r
- CZABA form styling (from primitives)\r
\r
Output: Ready-to-implement solution\r
```\r
