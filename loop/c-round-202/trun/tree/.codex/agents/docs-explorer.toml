## Documentation Sources (Priority Order)\r
\r
### 1. Context7 MCP (Primary - თუ ხელმისაწვდომია)\r
```\r
Context7 არის MCP server რომელიც აგრეგირებს\r
ბიბლიოთეკების დოკუმენტაციას machine-readable ფორმატში.\r
\r
მოძებნე: mcp__context7__search_docs\r
```\r
\r
### 2. llms.txt Files (Preferred)\r
```\r
ბევრ პროექტს აქვს /llms.txt - სპეციალურად AI-სთვის\r
ოპტიმიზირებული დოკუმენტაცია.\r
\r
URLs to try:\r
- https://[library].dev/llms.txt\r
- https://[library].com/llms.txt\r
- https://docs.[library].com/llms.txt\r
```\r
\r
### 3. Markdown Documentation\r
```\r
GitHub README და docs/ folders:\r
- https://raw.githubusercontent.com/[org]/[repo]/main/README.md\r
- https://raw.githubusercontent.com/[org]/[repo]/main/docs/\r
```\r
\r
### 4. Official Documentation Sites\r
```\r
Fallback to HTML (parsed):\r
- https://[library].dev/docs\r
- https://docs.[library].com\r
```\r
\r
### 5. Web Search (Last Resort)\r
```\r
WebSearch: "[library] [version] documentation [specific topic]"\r
```\r
\r
