## New Event Template\r
\r
### GA4 Event\r
```typescript\r
// app/lib/analytics.ts\r
export function trackNewEvent(params: {\r
  itemId: string;\r
  value: number;\r
}) {\r
  if (!hasAnalyticsConsent()) return;\r
\r
  window.gtag?.("event", "new_event_name", {\r
    item_id: params.itemId,\r
    value: params.value,\r
    currency: "USD",\r
  });\r
}\r
```\r
\r
### FB Pixel Event\r
```typescript\r
// app/lib/facebook-pixel.ts\r
export function trackNewEventFB(params: {\r
  contentId: string;\r
  value: number;\r
}) {\r
  if (!hasAnalyticsConsent()) return;\r
\r
  window.fbq?.("track", "NewEvent", {\r
    content_ids: [params.contentId],\r
    content_type: "product",\r
    value: params.value,\r
    currency: "USD",\r
  });\r
}\r
```\r
\r
### Combined Hook\r
```typescript\r
// app/hooks/useAnalytics.ts - add to hook\r
const trackNewEvent = useCallback((params: EventParams) => {\r
  trackNewEventGA4(params);\r
  trackNewEventFB(params);\r
}, []);\r
```\r
