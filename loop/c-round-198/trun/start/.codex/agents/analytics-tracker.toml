\r
## Common Issues\r
\r
| Issue | Cause | Solution |\r
|-------|-------|----------|\r
| Event არ იგზავნება | consent არ არის granted | Check `hasAnalyticsConsent()` |\r
| Duplicate events | useEffect deps wrong | Use empty deps `[]` for mount-only |\r
| Parameters არ ჩანს GA4-ში | Unregistered custom dimension | Register in GA4 Admin → Custom Definitions |\r
| FB Pixel Warning | Missing required params | Add content_ids, content_type |\r
| Events fire in dev only | Wrong measurement ID | Check `.env` for production GA_MEASUREMENT_ID |\r
| page_view double-fires | React StrictMode + Remix | Normal in dev, single in prod |\r
