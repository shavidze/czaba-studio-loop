## Debugging Guide\r
\r
### GA4 Debug Mode\r
```\r
1. Chrome Extension: "Google Analytics Debugger"\r
2. GA4 → Admin → DebugView → Real-time events\r
3. ან URL parameter: ?debug_mode=true\r
4. Console filter: "gtag" — ნახავ გაგზავნილ events-ს\r
```\r
\r
### Facebook Pixel Debug\r
```\r
1. Chrome Extension: "Meta Pixel Helper"\r
2. ნაჩვენებია ყოველი event ტიპი და parameters\r
3. FB Events Manager → Test Events → Test code\r
4. Console filter: "fbq" — ნახავ pixel calls\r
```\r
\r
### Common Debug Scenarios\r
\r
| Symptom | Check | Fix |\r
|---------|-------|-----|\r
| Event არ ჩანს GA4-ში | Console → `gtag` calls | Check consent, check gtag loaded |\r
| FB Pixel Warning | Meta Pixel Helper | Add missing required params |\r
| Duplicate events | Network tab filter `collect` | Check useEffect deps, remove StrictMode double-fire |\r
| Wrong event value | GA4 DebugView params | Check currency format, value calculation |\r
| Events only dev-ში | Production URL check | Verify measurement ID for prod |\r
\r
