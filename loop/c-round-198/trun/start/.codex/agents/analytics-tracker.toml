\r
## Event Validation Checklist\r
\r
ახალი event-ის დამატებისას:\r
\r
- [ ] GA4 event name snake_case-ში (არა camelCase)\r
- [ ] FB Pixel event name PascalCase-ში\r
- [ ] `hasAnalyticsConsent()` check ორივეში\r
- [ ] Required parameters populated (არა null/undefined)\r
- [ ] `currency: "USD"` e-commerce events-ში\r
- [ ] `items[]` array სწორი structure (item_id, item_name, price, quantity)\r
- [ ] Custom dimensions registered GA4 Admin-ში\r
- [ ] useAnalytics hook-ში დამატებული\r
- [ ] CookieConsent banner მუშაობს (test: clear localStorage)\r
\r
