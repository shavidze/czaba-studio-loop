## GDPR / Consent Management\r
\r
```typescript\r
// Consent flow:\r
// 1. CookieConsent.tsx shows banner\r
// 2. User accepts → localStorage.analytics_consent = "granted"\r
// 3. All tracking functions check hasAnalyticsConsent()\r
// 4. If not granted → events are silently skipped\r
\r
function hasAnalyticsConsent(): boolean {\r
  return localStorage.getItem("analytics_consent") === "granted";\r
}\r
\r
// GA4 consent mode\r
window.gtag?.("consent", "update", {\r
  analytics_storage: "granted",\r
  ad_storage: "granted",\r
});\r
```\r
\r
