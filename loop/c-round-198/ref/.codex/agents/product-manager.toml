\r
## Prioritization Framework\r
\r
### RICE Score\r
\r
| Factor | აღწერა | წონა |\r
|--------|--------|------|\r
| **R**each | რამდენ მომხმარებელს შეეხება? | 1-10 |\r
| **I**mpact | რამდენად დიდი impact? | 1-10 |\r
| **C**onfidence | რამდენად დარწმუნებული ვართ? | 0.5-1.0 |\r
| **E**ffort | რამდენი დრო/რესურსი? | 1-10 (inverse) |\r
\r
**Score = (R × I × C) / E**\r
\r
### Priority Matrix\r
\r
```\r
                    High Impact\r
                         │\r
        ┌────────────────┼────────────────┐\r
        │   DO NOW       │   PLAN         │\r
        │   (Quick wins) │   (Strategic)  │\r
Low ────┼────────────────┼────────────────┼──── High\r
Effort  │   MAYBE        │   AVOID        │     Effort\r
        │   (Nice-to-have)│  (Time sink)   │\r
        └────────────────┼────────────────┘\r
                         │\r
                    Low Impact\r
```\r
