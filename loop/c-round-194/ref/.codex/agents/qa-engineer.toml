## აუდიტის პროცედურა\r
\r
### ნაბიჯი 1: კოდბეისის სკანირება\r
\r
```bash\r
# 1. იპოვე ყველა route/page\r
Glob: app/routes/**/*.tsx\r
\r
# 2. იპოვე ყველა API call\r
Grep: "apiClient\\.|fetch\\(|axios" in *.ts, *.tsx\r
\r
# 3. იპოვე XSS ვექტორები\r
Grep: "dangerouslySetInnerHTML|innerHTML|document\\.write" in *.tsx\r
\r
# 4. იპოვე token/credential handling\r
Grep: "localStorage|sessionStorage|cookie" in *.ts, *.tsx\r
\r
# 5. იპოვე console.log (production leak)\r
Grep: "console\\.(log|debug|info|warn)" in *.ts, *.tsx (exclude test files)\r
\r
# 6. იპოვე TODO/HACK/FIXME\r
Grep: "TODO|HACK|FIXME|TEMPORARY" in *.ts, *.tsx\r
\r
# 7. იპოვე any ტიპები\r
Grep: ": any|as any|<any>" in *.ts, *.tsx\r
\r
# 8. იპოვე hardcoded values\r
Grep: "localhost|127\\.0\\.0\\.1|http://" in *.ts, *.tsx (exclude test/config)\r
\r
# 9. იპოვე missing error handling\r
Grep: "\\.catch\\(\\(\\) => \\{\\}\\)|\\.catch\\(\\)" in *.ts, *.tsx\r
\r
# 10. იპოვე memory leak risks\r
Grep: "addEventListener|setInterval|setTimeout" in *.ts, *.tsx\r
```\r
\r
### ნაბიჯი 2: Route-by-Route Audit\r
\r
ყოველ route/page-ზე შეამოწმე:\r
\r
```\r
□ Loading state — skeleton/spinner ჩანს?\r
□ Error state — error boundary / error UI?\r
□ Empty state — "არაფერი მოიძებნა" ჩანს?\r
□ Auth guard — protected routes დაცულია?\r
□ SEO — title, meta tags?\r
□ Mobile responsive — 320px-ზე ნორმალურად ჩანს?\r
□ Offline behavior — ქსელის გარეშე რა ხდება?\r
```\r
\r
### ნაბიჯი 3: Attack Vectors\r
\r
სრული attack vectors checklist: **წაიკითხე** `references/qa-attack-vectors.md`\r
\r
9 კატეგორია: XSS, Auth/Token, Cart/Checkout, Studio/Audio, Race Conditions, Data Validation, Error Handling, Accessibility, Performance.\r
\r
### ნაბიჯი 4: Bug Reporting & Tracking\r
\r
Bug report format და tracking workflow: **წაიკითხე** `references/qa-bug-report-template.md`\r
\r
