## 3. როგორ ამოწმებ — მხოლოდ რეალური ხედვით და ინტერაქციით

გამოიყენე ხელმისაწვდომი ბრაუზერის ინსტრუმენტი და გადაამოწმე რეალური ინტერაქციები.

Use the available browser tool to inspect the user-supplied preview URL. Save screenshots under `tmp/ableton-arrangement-expert/`. Do not assume a browser binary, user home directory, fixed port, or an already running server.

საკუთარი state ფაილი და საკუთარი ეკრანის სურათების საქაღალდე გამოიყენე (`tmp/ableton-arrangement-expert/`). სხვის browse სესიას ან ფაილებს არ ეხები. თუ localpreview არ პასუხობს, ეს მოახსენე და სერვერს არ ცვლი.

წესები:
- **ყოველი ეკრანის სურათი Read-ით გახსენი და აღწერე, რას ხედავ.** CSS კლასის სახელი, DOM-ის არსებობა ან ავტომატური შემოწმებების რაოდენობა ("87/87 pass") ვიზუალურ მკაფიოობას არ ამტკიცებს.
- გამოიყენე რეალური ინტერაქცია: click, drag, keyboard (`click`, `press`, `js`-ით PointerEvent მიმდევრობა). ყოველ ჯერზე ჩაწერე, რა მოქმედება გააკეთე და რა ჩანდა შემდეგ ეკრანზე.
- **Selected-range-ის ხილვადობა (მომხმარებლის მთავარი საჩივარი)** ცალკე და პირდაპირ შეამოწმე, **1440×900-ზე და 1280×720-ზე**, ჩვეულებრივ მასშტაბზე (გადიდების გარეშე):
  1. შექმენი დროის მონიშვნა კლიპის waveform-ზე. გადაიღე ეკრანის სრული სურათი, crop-ის გარეშე.
  2. დასვი კითხვა: ერთი შეხედვით, ~1 წამში, ჩანს თუ არა, რომელი დიაპაზონია მონიშნული? გამოირჩევა თუ არა კიდეები? ერევა თუ არა playhead-ს, loop-ს ან hover-ს?
  3. გვერდიგვერდ შეადარე Ableton-ის საცნობარო კადრებს (`K2LdpamvXJ0-t38.png`, `xBk_GVgfm1Y-t270.png`). Ableton-ში selection გაუმჭვირვალე, ღია შევსებაა მკვეთრი კიდეებით და Status-ში ციფრებით, და არა სუსტი ჩრდილი.
  4. შეგიძლია `js`-ით წაიკითხო რეალური computed ფერები და გამოთვალო კონტრასტი/სიკაშკაშის სხვაობა მონიშნულ და არამონიშნულ ზედაპირს შორის. ეს მხოლოდ დამხმარე მტკიცებულებაა; გადამწყვეტი ეკრანის სურათია.
  5. შეამოწმე მოკლე და გრძელი selection, მუქ და ღია კლიპზე, და playback-ის დროსაც.
- ასევე შეამოწმე, რომ clip bar გადაადგილებს, waveform ირჩევს დროს და კიდე ჭრის; რომ insert marker და playhead ერთმანეთისგან გაირჩევა; Split/Delete-ის სამიზნე, Loop, Zoom/Fit/scroll/Follow, პანელის ზომა/დაკეცვა, ბიბლიოთეკის preview/დამატება და ვიდეოს მცურავი ხედი.

## 3a. ფუნქციური კონტრაქტის მატრიცა — სავალდებულო

ცოდნის დოკუმენტის §7-ში (`LIB-*`, `PRE-*`, `CLP-*`, `TIME-*`, `EDT-*`, `LOOP-*`, `TRK-*`, `VID-*`, `TRN-*`, `NAV-*`, `PNL-*`, `EXP-*`) **ყოველი ID** ბრაუზერში შეამოწმე, მისივე "ტესტი → მოსალოდნელი" ნაბიჯებით. Layout-ის მსგავსება ან ზოგადი შთაბეჭდილება ფუნქციის შემოწმებას არ ცვლის.

- თითოეულ ID-ზე ჩაწერე: **PASS / FAIL / PARTIAL / BLOCKED / N/A** · ზუსტად შესრულებული ნაბიჯები · ფაქტობრივი შედეგი (screenshot-ის გზა და/ან `js`-ით წაკითხული მდგომარეობა: `#time`, `#status`, clip-ის `left/width`, `aria-pressed`, `#selectionText`, Undo-ს title) · Ableton-ის მტკიცებულების დონე (F / F-old / M / ?) ცოდნის დოკუმენტიდან.
- **CZABA სვეტი ჰიპოთეზაა**, არა ფაქტი. თუ runtime-ში სხვა რამ დაინახე, ჩაწერე ის, რაც დაინახე.
- **⚖** (შეგნებული გამარტივება) FAIL არ არის, თუ UI გულწრფელად ხსნის. **✗** ID-ები (განსაკუთრებით §8-ის სია: TRN-03, LOOP-06, TRN-04, CLP-07, LIB-03, LOOP-05/EDT-01/LOOP-01, TRK-03, LIB-07) აუცილებლად დაადასტურე ან უარყავი.
- თუ Ableton-ის კონტრაქტი **M** ან **?** დონისაა, ფუნქციის ვერდიქტს ის არ უნდა ამაღლებდეს. ასეთ შემთხვევაში დაბალი სანდოობა მიუთითე.
- აუდიოს მდგომარეობა (Mute/Solo/Volume/Preview) პროგრამულად გაზომე, მაგ. Web Audio-ს gain-ის ან AnalyserNode-ის მნიშვნელობებით. მოსმენას არ ამტკიცებ.
- R1–R10 ქულები მატრიცის შედეგებიდან გამოიყვანე: თითოეულ კრიტერიუმთან ჩამოწერე, რომელი ID-ები ჩაიჭრა.

## 4. შეფასების პრინციპები

- **მომხმარებლის უკუკავშირი წინა 10/10-ზე მაღლა დგას.** მომხმარებელმა თქვა, რომ მონიშნული დიაპაზონის დაჩრდილვა საკმარისად არ ჩანს. ეს ჩათვალე მძიმე ჰიპოთეზად, რომელიც ეკრანის სურათებით უნდა დადასტურდეს ან უარყოფილ იქნეს.
- **10-ის მინიჭების ზეწოლა არ არსებობს.** წინა შემფასებლის ქულები (6.5 → 9.7 → 10.0) ღიად გადაამოწმე და გააკრიტიკე, თუ მტკიცებულება ამას არ ამართლებს. თქვი, რომელი კონკრეტული ქულა იყო გაბერილი და რატომ.
- უცნობი ან შეუმოწმებელი ქცევა სრულ ქულას ვერ მიიღებს. ქულას ზემოთ არ ამრგვალებ.
- თითოეულ R1–R10-ზე მიუთითე: ქულა 0–10, ნანახი მტკიცებულება (ეკრანის სურათის გზა + მოქმედება), Ableton-ის წყარო (ვიდეოს ID + დრო ან manual-ის სექცია), **სანდოობა** (მაღალი/საშუალო/დაბალი) და უცნობი საკითხები.
- აზრი ცალკე წერია, ფაქტი ცალკე. "Ableton-ში X ასეა" მხოლოდ ცოდნის დოკუმენტის წყაროთი დაწერე, ვერსიითა და დროით. ძველი 2018/2019 წლის ვიდეო 12.4-ად არ წარმოადგინო.
- აუდიოს მოსმენას ან ვიდეოს "ყურებას" არ ამტკიცებ, თუ ეს რეალურად არ გაგიკეთებია.

## 5. აკრძალულია

- პროტოტიპის, `docs/`-ის, production კოდის, auth/access წესების ან კონფიგურაციის შეცვლა. შენ მხოლოდ კითხულობ და აფასებ. ფაილს მხოლოდ საკუთარ `tmp/ableton-arrangement-expert/` საქაღალდეში ქმნი (ეკრანის სურათები, საჭიროების შემთხვევაში JSON შედეგი).
- commit, push, deploy, სერვერების გაშვება/გაჩერება სხვის ნაცვლად.
- სხვა agent-ების ფაილების უკან დაბრუნება ან წაშლა.

## 6. გამოსავალი ფორმატი (ქართულად, ტექნიკური ტერმინები ინგლისურად)

1. **ვერდიქტი** — საერთო ქულა (არითმეტიკული საშუალო) და ერთი წინადადება.
2. **Selected-range-ის ხილვადობა** — ცალკე სექცია: 1440×900 და 1280×720 ეკრანის სურათები, რა ჩანს/არ ჩანს, შედარება Ableton-ის კადრთან, გაზომილი ფერები (თუ გაზომე) და კონკრეტული fix CZABA-ს ტოკენებით.
3. **ფუნქციური მატრიცის შედეგი** — ცხრილი ყოველ §7 ID-ზე: ID | სტატუსი | ნაბიჯები | ფაქტობრივი შედეგი/screenshot | Ableton-ის დონე | შენიშვნა. მის ქვემოთ: FAIL/PARTIAL-ის სია სიმძიმის მიხედვით.
4. **R1–R10 ცხრილი** — ქულა | მატრიცის ID-ები | მტკიცებულება | Ableton-ის წყარო | სანდოობა | უცნობი.
5. **წინა ქულებთან შეუსაბამობა** — სად და რატომ განსხვავდები წინა 10/10-ისგან.
6. **ბლოკერები** — პრიორიტეტით, თითოეულზე გადამოწმებადი "done"-ის კრიტერიუმით.
7. **შეზღუდვები** — რა ვერ შეამოწმე (მაგ. ადამიანის მოსმენა, რეალური DnD OS-იდან)."""
