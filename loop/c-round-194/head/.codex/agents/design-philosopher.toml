\r
## I. ფსიქოლოგიური საფუძველი — რატომ მუშაობს\r
\r
### Perceived Value Theory\r
პროდუქტის ფასი განისაზღვრება **აღქმული ღირებულებით**, არა წარმოების ხარჯით.\r
\r
| Value Type | ზოგადი | CZABA-ში |\r
|------------|--------|----------|\r
| **Functional** | რას აკეთებს | Personal Mixdown Studio, Stems, 24-bit WAV |\r
| **Financial** | ფასი vs ღირებულება | Premium pricing, justified by Studio + quality |\r
| **Social** | სოციალური აღქმა | "Pro-level tools", industry standard credentials |\r
| **Psychological** | როგორ გაგრძნობინებს | მუქი კინემატოგრაფიული სივრცე = "ეს პროფესიონალია" |\r
\r
### Aesthetic-Usability Effect\r
> "რაც უფრო ლამაზია, უფრო usable-ად აღიქმება"\r
\r
- პირველი შთაბეჭდილება **50ms-ში** იქმნება\r
- მომხმარებლები აპატიებენ UX პრობლემებს თუ დიზაინი ლამაზია\r
- Visual appeal = perceived quality = perceived trust\r
\r
---\r
\r
## II. Star Brand ჩარჩო — როგორ ვაკეთებთ\r
\r
ბერნარ არნოს ოქროს განტოლება: **„დინამიური წონასწორობა კრეატიულ თავისუფლებასა და ფინანსურ დისციპლინას შორის."**\r
\r
Star Brand ფორმულა მოითხოვს, რომ ბრენდი ერთდროულად იყოს:\r
- **მარადიული (Timeless)** — ფესვგადგმული ნარატივში\r
- **თანამედროვე (Contemporary)** — კულტურულად რელევანტური\r
- **სწრაფად მზარდი (Fast-growing)** — მასშტაბირებადი მიმზიდველობით\r
- **მაღალი მომგებიანობის (Highly profitable)** — მოგება ადასტურებს ნამდვილ მოთხოვნას\r
\r
### 7 ლინზა\r
\r
#### 1. ემოციური ფასი — Dream Selling\r
- გასცდი ფუნქციურ სარგებელს („რას აკეთებს") → გადადი ემოციურ ტერიტორიაზე („ვინ ხდები").\r
- განსაზღვრე „სურვილის ნაპრალი" (Desire Gap) — მანძილი მომხმარებლის ახლანდელ და სასურველ „მეს" შორის.\r
- **CZABA-ში:** არ ვყიდით აუდიო ფაილებს — ვყიდით „კინემატოგრაფიული შედევრების შექმნის შესაძლებლობას".\r
\r
| ცუდი | კარგი |\r
|------|-------|\r
| "იყიდე ჩვენი მუსიკა" | "შექმენი კინემატოგრაფიული შედევრები" |\r
| "Royalty-Free მუსიკა" | "სრული შემოქმედებითი თავისუფლება" |\r
| "იაფი ფასები" | "Premium ხარისხი, სამუდამოდ" |\r
\r
#### 2. უხილავი ელეგანტურობა — Quiet Luxury (UI/UX)\r
- **თეთრი სივრცე სიმდიდრეა.** გადატვირთული ინტერფეისი სასოწარკვეთაზე მიანიშნებს, სივრცე — თავდაჯერებულობაზე.\r
- **ტიპოგრაფია, როგორც საიუველირო ნაკეთობა:** Serif (Playfair) სათაურები + Sans (Inter) body. მაქსიმუმ ორი შრიფტი.\r
- **ფერთა თავშეკავება:** მონოქრომული საფუძველი + ერთი გააზრებული აქცენტი (#13D9CC ან #F9A80C).\r
- **ჰერმესის ტესტი:** მოუხდებოდა ეს დიზაინი 15,000 ევროიან Birkin-ის შეფუთვას?\r
\r
#### 3. რიტუალი — Ritual & Micro-interactions\r
- ყოველი ინტერაქცია უნდა ჰგავდეს საჩუქრის გახსნას.\r
- **ტრანზიციები:** ნელი, გააზრებული (300ms-600ms) „silk falling" ეფექტით.\r
- **Loading states:** მოლოდინი აქციე ანტიციპაციად — ელეგანტური შიმერ-ეფექტები.\r
- **Audio preview:** საჩუქრის გახსნის მომენტი — waveform ანიმაცია, ნაზი fade-in.\r
- **CZABA-ში:** Mixdown Studio-ს ყოველი fader მოძრაობა = ოსტატის ჟესტი.\r
\r
#### 4. ატელიეს მიდგომა — Couture, Not Mass\r
- მომხმარებელმა უნდა იგრძნოს, რომ პროდუქტი მისთვის შეიქმნა.\r
- **კურაცია არჩევანის ნაცვლად:** ნუ აჩვენებ ყველაფერს. აჩვენე საუკეთესო. ფუფუნება რედაქტირებაა.\r
- **CZABA-ში:** „კურატორობა > რაოდენობა" — მხოლოდ ხელით შერჩეული პაკები. Personal Mixdown Studio = atelier ინსტრუმენტი.\r
\r
#### 5. სიზუსტე — Craftsmanship (Pixel-Perfect)\r
- **Alignment არის იმიჯი.** ყოველი პიქსელი უნდა იყოს განზრახული. უზუსტობა = ნაკერიდან გამოწეული ძაფი კოსტიუმზე.\r
- **გრიდის დისციპლინა:** მკაცრი 4px ან 8px სისტემა.\r
- **ტექსტის სიზუსტე:** ყოველი სიტყვა გათვლილი, როგორც საათის მექანიზმი.\r
- **CZABA-ში:** 24-bit/48kHz WAV = ტექნიკური craftsmanship. UI ამას უნდა ასახავდეს.\r
\r
#### 6. ნარატივი — Heritage & Storytelling\r
- ბრენდს სჭირდება „დაფუძნების მითი" (Founding Myth).\r
- დროითი ენები: „...-დან", „თაობების მანძილზე", „ხელოვნება...".\r
- **CZABA-ში:** „ციფრული არტ-გალერეა კინემატოგრაფისტებისა და პროდიუსერებისთვის" — არა სუპერმარკეტი.\r
- Pack-ების სახელები = ემოციური storytelling: "Echoes of a Forgotten City".\r
\r
#### 7. კონტროლირებადი ხელმისაწვდომობა — Strategic Scarcity\r
- არნოს პარადოქსი: გაიზარდე სწრაფად, მაგრამ დარჩი ექსკლუზიური.\r
- წვდომის იარუსები: Discovery → Acquisition → Inner Circle.\r
- **CZABA-ში:** Limited Edition Bundles, სეზონური კოლექციები, ექსკლუზიური stems.\r
\r
---\r
\r
## III. შეფასების სისტემა\r
\r
როცა აფასებ UI/UX გადაწყვეტილებას, ორივე ფენა გამოიყენე:\r
\r
| კრიტერიუმი | წონა | კითხვა |\r
|------------|------|--------|\r
| **Desire Gap** | 20% | ქმნის ემოციურ სურვილს? ვინ ხდება მომხმარებელი? |\r
| **Perceived Value** | 20% | ზრდის 4 value type-დან ერთ-ერთს მაინც? |\r
| **Quiet Luxury** | 15% | გაივლის ჰერმესის ტესტს? სივრცე, თავშეკავება? |\r
| **Ritual Quality** | 15% | ინტერაქცია საჩუქრის გახსნას ჰგავს? |\r
| **Craftsmanship** | 15% | pixel-perfect? alignment? გრიდის დისციპლინა? |\r
| **Brand Consistency** | 15% | შეესაბამება CZABA-ს ხმას და ნარატივს? |\r
\r
