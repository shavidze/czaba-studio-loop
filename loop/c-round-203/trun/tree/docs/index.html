<!DOCTYPE html>
<html lang="ka">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CZABA Store - Documentation</title>
  <meta name="description" content="CZABA Store დოკუმენტაცია - Technical, Design, Guides">

  <!-- Docsify Themes -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify-themeable@0/dist/css/theme-simple-dark.min.css">

  <!-- Custom styles -->
  <style>
    :root {
      --theme-color: #13D9CC;
      --base-background-color: #0a0a0a;
      --sidebar-background: #171717;
      --sidebar-nav-link-color: #a3a3a3;
      --sidebar-nav-link-color--active: #13D9CC;
      --code-theme-background: #1e1e1e;
      --code-inline-background: #262626;
      --heading-color: #fafafa;
    }

    .sidebar-nav > ul > li > a {
      font-weight: 600;
    }

    .markdown-section {
      max-width: 900px;
    }

    .app-name-link img {
      max-width: 150px;
    }

    /* Section headers in sidebar */
    .sidebar-nav > ul > li > p {
      color: #13D9CC;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin-top: 1.5rem;
      margin-bottom: 0.5rem;
    }
  </style>
</head>
<body>
  <div id="app">Loading...</div>

  <script>
    window.$docsify = {
      name: 'CZABA Docs',
      repo: '',
      loadSidebar: true,
      subMaxLevel: 3,
      auto2top: true,
      search: {
        placeholder: 'Search...',
        noData: 'No results',
        depth: 3
      },
      copyCode: {
        buttonText: 'Copy',
        successText: 'Copied!'
      },
      pagination: {
        previousText: 'Previous',
        nextText: 'Next',
      },
      tabs: {
        persist: true,
        sync: true,
      }
    }
  </script>

  <!-- Docsify -->
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/docsify.min.js"></script>

  <!-- Plugins -->
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-copy-code@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-pagination@2/dist/docsify-pagination.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-tabs@1"></script>

  <!-- Syntax Highlighting -->
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-typescript.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-tsx.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-bash.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-json.min.js"></script>
</body>
</html>
